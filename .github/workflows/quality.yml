name: Quality

# Tắt tự động chạy (2026-10-16, theo yêu cầu chủ dự án): chỉ chạy tay qua tab Actions → Run workflow.
# Trigger cũ được giữ trong lịch sử git; muốn bật lại thì khôi phục khối `on:` từ commit trước.
on:
  workflow_dispatch:

# S20: action pin theo commit SHA (tag có thể bị dời); comment ghi tag tương ứng.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
